<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>Expense Tracker</h1>
        <form id="expenseForm">
            <label>Total Salary</label>
            <input
              type="number"
              id="salary"
              placeholder="Enter Total Salary">

              <label>Expense Name</label>
              <input
               type="text"
               id="expenseName"
               placeholder="Enter Expense Name">

               <label>Expense Amount</label>
               <input 
                type="number"
                id="expenseAmount"
                placeholder="Enter Expense Amount">

                <button type="submit">
                    Add Expense
                </button>

                <p id="error"></p>

        </form>

        <hr>
         
        <h2>Summary</h2>

        <p>Total Salary:
              ₹<span id="salaryDisplay">0</span>
        </p>

        <p>Total Expenses:
              ₹<span id="totalExpenseDisplay">0</span>
        </p>

        <p>Remaining Balance:
              ₹<span id="balanceDisplay">0</span>
        </p>

        <hr>

        <h2>Expense List</h2>

        <ul id="expenseList"></ul>

        <button id = "downloadBtn">Download Report</button>
          <br><br>
        <button id="newDataBtn">New Data</button>
        <h2>Expense Overview</h2>
    <canvas id="expenseChart"></canvas>

 <div id="warningBanner" class="warning-banner">
        ⚠️ Critical Warning! Remaining balance is below 10% of your salary.
    </div>

    </div>

   
    
    <script src="script.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</body>

</html>
